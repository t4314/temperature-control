<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Temperature Control</title>
</head>
<body>
  <h1>Set Target Temperature</h1>
  
  <!-- Form to Set Target Temperature -->
  <form action="/set-temperature" method="POST">
    <label for="temperature">Target Temperature (°F): </label>
    <input type="number" id="temperature" name="temperature" required>
    <input type="submit" value="Set Temperature">
  </form>

  <h2>Current Temperature and Relay Status</h2>
  <p>Current Temperature: <span id="currentTemperature">Loading...</span> °F</p>
  <p>Relay Status: <span id="relayStatus">Loading...</span></p>

  <script>
    // Function to fetch the current temperature and relay status
    function getStatus() {
      fetch('/status')
        .then(response => response.json())
        .then(data => {
          document.getElementById('currentTemperature').textContent = data.currentTemperature;
          document.getElementById('relayStatus').textContent = data.relayStatus ? 'ON' : 'OFF';
        })
        .catch(error => console.log('Error fetching status:', error));
    }

    // Fetch initial status when the page loads
    window.onload = function() {
      getStatus();
    }
  </script>
</body>
</html>
