<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Temperature Monitoring</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    form {
      margin: 20px 0;
    }
    input[type="number"] {
      padding: 10px;
      width: 120px;
      font-size: 1rem;
      margin-right: 10px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }
    .status {
      margin-top: 30px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .status p {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <h1>ESP32 Temperature Monitoring</h1>

  <!-- Form to set the target temperature -->
  <form action="/set-temperature" method="POST">
    <label for="temperature">Target Temperature (°F):</label>
    <input type="number" id="temperature" name="temperature" required>
    <input type="submit" value="Set Temperature">
  </form>

  <!-- Display current temperature readings and relay status -->
  <div class="status">
    <h2>Current Status</h2>
    <p>Temperature Sensor 1: <span id="temp1">Loading...</span> °F</p>
    <p>Temperature Sensor 2: <span id="temp2">Loading...</span> °F</p>
    <p>Target Temperature: <span id="targetTemp">Loading...</span> °F</p>
    <p>Relay Status: <span id="relayStatus">Loading...</span></p>
  </div>

  <!-- JavaScript to update the data periodically -->
  <script>
    setInterval(function() {
      fetch('/status')
        .then(response => response.json())
        .then(data => {
          document.getElementById('temp1').innerText = data.currentTemperature1;
          document.getElementById('temp2').innerText = data.currentTemperature2;
          document.getElementById('targetTemp').innerText = data.targetTemperature;
          document.getElementById('relayStatus').innerText = data.relayStatus ? 'ON' : 'OFF';
        });
    }, 5000); // Update every 5 seconds
  </script>

</body>
</html>
