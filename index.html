<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ESP32 Temperature Monitoring</title>
  </head>
  <body>
    <h1>Set Target Temperature</h1>
    <form action="/set-temperature" method="POST">
      <label for="temperature">Target Temperature (°F):</label>
      <input type="number" id="temperature" name="temperature" required>
      <input type="submit" value="Set Temperature">
    </form>

    <h2>Status</h2>
    <p>Current Temperature: <span id="current-temperature">Loading...</span></p>
    <p>Relay Status: <span id="relay-status">Loading...</span></p>

    <script>
      function updateStatus() {
        fetch('/status')
          .then(response => response.json())
          .then(data => {
            document.getElementById('current-temperature').textContent = data.currentTemperature + ' °F';
            document.getElementById('relay-status').textContent = data.relayStatus ? 'ON' : 'OFF';
          });
      }
      
      setInterval(updateStatus, 5000);
      updateStatus();
    </script>
  </body>
</html>
