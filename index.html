<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Temperature Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            font-size: 18px;
            margin-right: 10px;
        }
        input[type="number"] {
            font-size: 16px;
            padding: 5px;
            width: 120px;
        }
        input[type="submit"] {
            font-size: 16px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>ESP32 Temperature Monitoring</h1>
    <form action="/set-temperature" method="POST">
        <label for="temperature">Set Target Temperature (°F):</label>
        <input type="number" id="temperature" name="temperature" required>
        <input type="submit" value="Set Temperature">
    </form>

    <div class="status">
        <h2>Current Temperature Status</h2>
        <p id="currentTemperature">Loading...</p>
        <p id="relayStatus">Loading...</p>
    </div>

    <script>
        // Function to fetch temperature and relay status from the ESP32
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('currentTemperature').innerHTML = 'Current Temperature: ' + data.currentTemperature + '°F';
                    document.getElementById('relayStatus').innerHTML = 'Relay Status: ' + (data.relayStatus ? 'ON' : 'OFF');
                });
        }

        // Update status every 5 seconds
        setInterval(updateStatus, 5000);
        updateStatus();
    </script>
</body>
</html>
